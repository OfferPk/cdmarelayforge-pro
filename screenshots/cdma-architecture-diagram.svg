<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040713"/>
      <stop offset="100%" stop-color="#0a1226"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101b38"/>
      <stop offset="100%" stop-color="#0b142a"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#651fff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="940" height="560" fill="url(#bgGrad)"/>

  <!-- Grid overlay -->
  <g stroke="#162444" stroke-width="1" opacity="0.35">
    <line x1="0" y1="70" x2="940" y2="70"/>
    <line x1="0" y1="140" x2="940" y2="140"/>
    <line x1="0" y1="210" x2="940" y2="210"/>
    <line x1="0" y1="280" x2="940" y2="280"/>
    <line x1="0" y1="350" x2="940" y2="350"/>
    <line x1="0" y1="420" x2="940" y2="420"/>
    <line x1="0" y1="490" x2="940" y2="490"/>
    <line x1="160" y1="0" x2="160" y2="560"/>
    <line x1="320" y1="0" x2="320" y2="560"/>
    <line x1="480" y1="0" x2="480" y2="560"/>
    <line x1="640" y1="0" x2="640" y2="560"/>
    <line x1="800" y1="0" x2="800" y2="560"/>
  </g>

  <!-- Header Banner -->
  <rect x="30" y="20" width="880" height="60" rx="8" fill="url(#cardGrad)" stroke="#18284c" stroke-width="1.5"/>
  <circle cx="65" cy="50" r="18" fill="url(#accentCyan)"/>
  <text x="65" y="56" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#000" text-anchor="middle">🛰️</text>
  <text x="100" y="44" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="0.5">CDMARelayForge Pro | 2 GHz CDMA Data Relay &amp; PN Ranging Architecture</text>
  <text x="100" y="64" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#00e5ff" letter-spacing="1">NORMATIVE BASELINE: CCSDS 415.1-B-1 (BLUE BOOK) &amp; SNIP DSSS INTEROPERABILITY</text>
  <rect x="735" y="35" width="155" height="30" rx="6" fill="#00e676" fill-opacity="0.15" stroke="#00e676" stroke-width="1"/>
  <text x="812" y="54" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#00e676" text-anchor="middle">10/10 CDMA CERTIFIED</text>

  <!-- Left: Forward Service UQPSK (Network -> User) -->
  <rect x="30" y="95" width="425" height="320" rx="8" fill="url(#cardGrad)" stroke="#18284c" stroke-width="1.5"/>
  <rect x="30" y="95" width="425" height="36" rx="8" fill="#142244"/>
  <text x="45" y="118" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#00e5ff">1. FORWARD SERVICE LINK (UQPSK 10:1 §4)</text>
  <text x="375" y="118" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#8da4cb">2067.5 MHz</text>

  <g transform="translate(45, 145)">
    <rect x="0" y="0" width="395" height="50" rx="4" fill="#070c1a" stroke="#00e5ff" stroke-width="1"/>
    <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#00e5ff">In-Phase (I) Command Channel [Power Weight = 10]</text>
    <text x="12" y="36" font-family="monospace" font-size="9" fill="#a4c5eb">Command Data Symbols XOR Order-10 Gold Code (1023 Chips)</text>

    <rect x="0" y="60" width="395" height="50" rx="4" fill="#070c1a" stroke="#7c4dff" stroke-width="1"/>
    <text x="12" y="78" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#7c4dff">Quadrature (Q) Range Channel [Power Weight = 1]</text>
    <text x="12" y="96" font-family="monospace" font-size="9" fill="#a4c5eb">Unmodulated Dedicated Range Gold Code (Epoch Synchronizer)</text>

    <rect x="0" y="120" width="395" height="42" rx="4" fill="#050914" stroke="#ffb300" stroke-width="1"/>
    <text x="12" y="138" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffb300">Gold Code LFSR Generator (Length 1023):</text>
    <text x="12" y="152" font-family="monospace" font-size="9" fill="#a4c5eb">f1(x) = 1+x^3+x^10 | f2(x) = 1+x^2+x^3+x^6+x^8+x^9+x^10</text>

    <rect x="0" y="172" width="395" height="42" rx="4" fill="#070c1a" stroke="#00e676" stroke-width="1"/>
    <text x="12" y="190" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#00e676">Chip Rate &amp; Spectral Spreading Gain:</text>
    <text x="12" y="204" font-family="monospace" font-size="9" fill="#a4c5eb">Rc = 3.0 or 3.087 Mchip/s | Earth Surface PSD &lt; -154 dBW/m²/4kHz</text>
  </g>

  <!-- Right: Return Service SQPN & Coherent Turnaround -->
  <rect x="485" y="95" width="425" height="320" rx="8" fill="url(#cardGrad)" stroke="#18284c" stroke-width="1.5"/>
  <rect x="485" y="95" width="425" height="36" rx="8" fill="#142244"/>
  <text x="500" y="118" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#00e676">2. RETURN SERVICE LINK (SQPN 1:4 §5)</text>
  <text x="815" y="118" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#8da4cb">2245.25 MHz</text>

  <g transform="translate(500, 145)">
    <!-- Coherent Ratio Box -->
    <rect x="0" y="0" width="395" height="48" rx="4" fill="#070c1a" stroke="#00e676" stroke-width="1"/>
    <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#00e676">Coherent Turnaround Frequency Ratio: 240 / 221 (§5.2)</text>
    <text x="12" y="36" font-family="monospace" font-size="9" fill="#ffffff">f_return = f_forward * (240 / 221) = 2067.5 * 1.08597 = 2245.2489 MHz</text>

    <!-- Stagger SQPN -->
    <rect x="0" y="58" width="395" height="50" rx="4" fill="#070c1a" stroke="#7c4dff" stroke-width="1"/>
    <text x="12" y="78" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#7c4dff">Staggered Quadrature PN (SQPN 1/2-Chip Stagger)</text>
    <text x="12" y="96" font-family="monospace" font-size="9" fill="#a4c5eb">I: Pilot Code (Weight 1) | Q: Telemetry Data XOR Code (Weight 4, +6dB)</text>

    <!-- Two-Way Ranging -->
    <rect x="0" y="118" width="395" height="50" rx="4" fill="#070c1a" stroke="#ffb300" stroke-width="1"/>
    <text x="12" y="138" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffb300">Two-Way Round-Trip PN Ranging &amp; Doppler (§7.6):</text>
    <text x="12" y="154" font-family="monospace" font-size="9" fill="#a4c5eb">Range: R = (c * RTLT) / 2 (&lt;0.15m error) | Doppler: v = -(c * Delta_f)/(2*f_rtn)</text>

    <!-- Clock Calibration USCCS -->
    <rect x="0" y="178" width="395" height="36" rx="4" fill="#050914" stroke="#18284c" stroke-width="1"/>
    <text x="12" y="200" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#00e5ff">USCCS Precision Time Transfer: Sub-nanosecond spacecraft clock lock</text>
  </g>

  <!-- Bottom: Normative Standards Bar -->
  <rect x="30" y="430" width="880" height="105" rx="8" fill="url(#cardGrad)" stroke="#18284c" stroke-width="1.5"/>
  <rect x="30" y="430" width="880" height="28" rx="8" fill="#142244"/>
  <text x="45" y="449" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#00e676">CCSDS 415.1-B-1 NORMATIVE COMPLIANCE VERIFICATION CHECKLIST (10/10 PASS)</text>
  <text x="810" y="449" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#8da4cb">BLUE BOOK 2011</text>

  <g transform="translate(45, 468)">
    <rect x="0" y="0" width="160" height="52" rx="4" fill="#070c1a" stroke="#00e676" stroke-width="1"/>
    <text x="8" y="16" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#00e676">CDMA-001 &amp; CDMA-002</text>
    <text x="8" y="32" font-family="monospace" font-size="9" fill="#a4c5eb">DSSS Architecture</text>
    <text x="8" y="45" font-family="monospace" font-size="9" fill="#a4c5eb">Order-10 Gold LFSR</text>

    <rect x="175" y="0" width="160" height="52" rx="4" fill="#070c1a" stroke="#00e676" stroke-width="1"/>
    <text x="8" y="16" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#00e676">CDMA-003 &amp; CDMA-004</text>
    <text x="8" y="32" font-family="monospace" font-size="9" fill="#a4c5eb">Forward UQPSK 10:1</text>
    <text x="8" y="45" font-family="monospace" font-size="9" fill="#a4c5eb">Dedicated Q Ranging</text>

    <rect x="350" y="0" width="160" height="52" rx="4" fill="#070c1a" stroke="#00e676" stroke-width="1"/>
    <text x="8" y="16" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#00e676">CDMA-005 &amp; CDMA-006</text>
    <text x="8" y="32" font-family="monospace" font-size="9" fill="#a4c5eb">Return SQPN 1:4</text>
    <text x="8" y="45" font-family="monospace" font-size="9" fill="#a4c5eb">Coherent Ratio 240/221</text>

    <rect x="525" y="0" width="160" height="52" rx="4" fill="#070c1a" stroke="#00e676" stroke-width="1"/>
    <text x="8" y="16" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#00e676">CDMA-007 &amp; CDMA-008</text>
    <text x="8" y="32" font-family="monospace" font-size="9" fill="#a4c5eb">Two-Way Sub-Meter Range</text>
    <text x="8" y="45" font-family="monospace" font-size="9" fill="#a4c5eb">Carrier Doppler Velocity</text>

    <rect x="700" y="0" width="160" height="52" rx="4" fill="#070c1a" stroke="#00e676" stroke-width="1"/>
    <text x="8" y="16" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#00e676">CDMA-009 &amp; CDMA-010</text>
    <text x="8" y="32" font-family="monospace" font-size="9" fill="#a4c5eb">Surface PSD &lt; -154 dBW</text>
    <text x="8" y="45" font-family="monospace" font-size="9" fill="#a4c5eb">USCCS Time Transfer</text>
  </g>
</svg>
